# Garage, keeping the site's pictures on this one server. Its secret comes from
# GARAGE_RPC_SECRET (see docker-compose.yml), so this file has none.
metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
db_engine = "sqlite"
# A copy of the metadata every few hours, to recover from if it's ever damaged
metadata_auto_snapshot_interval = "6h"
replication_factor = 1

rpc_bind_addr = "[::]:3901"
rpc_public_addr = "127.0.0.1:3901"

# Uploads, with links the site signs. A bucket is reached at <bucket>.tinderhaj.com,
# so the images bucket is images.tinderhaj.com, for uploading and reading alike.
[s3_api]
s3_region = "garage"
api_bind_addr = "[::]:3900"
root_domain = ".tinderhaj.com"

# Reading, for anyone, from buckets that allow it
[s3_web]
bind_addr = "[::]:3902"
root_domain = ".tinderhaj.com"
