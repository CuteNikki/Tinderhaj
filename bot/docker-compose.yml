services:
  tinderhaj-bot:
    build:
      context: ..
      dockerfile: bot/Dockerfile
    container_name: tinderhaj-bot
    restart: unless-stopped
    # The site's .env, which has everything the bot needs. See the README's Discord Bot section.
    env_file:
      - ../.env
    volumes:
      - ./logs:/app/bot/logs
    networks:
      - default
      - postgres_network

    # On the VPS's dashboard (gethomepage), with the other bots.
    labels:
      homepage.group: 'Discord Bots'
      homepage.name: 'Tinderhaj'
      homepage.icon: 'si-discord'
      homepage.href: 'https://github.com/CuteNikki/Tinderhaj'

# The Postgres container's network, like CuteNikki/DiscordBot's, so the bot can reach the site's database.
networks:
  postgres_network:
    external: true
    name: postgres_default
